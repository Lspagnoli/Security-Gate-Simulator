apiVersion: apps/v1
kind: Deployment
metadata:
  name: securechain-app
  namespace: securechain-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: securechain-app
  template:
    metadata:
      labels:
        app: securechain-app
    spec:
      containers:
        - name: securechain-app
          image: 723322847039.dkr.ecr.us-east-1.amazonaws.com/security-gate-simulator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
